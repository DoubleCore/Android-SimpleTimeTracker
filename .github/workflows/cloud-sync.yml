name: Cloud sync
on:
  push:
    branches: ['feature/xiaomi-watch5-lan-v159']
    paths: ['server/cloud-sync/**', 'cloud_sync/**', 'tools/cloud-app/**', '.github/workflows/cloud-sync.yml', 'app/build.gradle.kts', 'wear/build.gradle.kts', 'settings.gradle.kts']
  pull_request:
    paths: ['server/cloud-sync/**', 'cloud_sync/**', 'tools/cloud-app/**', '.github/workflows/cloud-sync.yml', 'app/build.gradle.kts', 'wear/build.gradle.kts', 'settings.gradle.kts']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Server persistence, replay, conflict and real HTTP tests
        run: python -m unittest discover -s server/cloud-sync/tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build universal cloud recording APK and lint
        run: bash ./gradlew -p tools/cloud-app :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest :cloud_sync:lintDebug --no-daemon
      - name: Package APK and deployable server from the same commit
        run: |
          mkdir -p delivery
          cp tools/cloud-app/app/build/outputs/apk/debug/app-debug.apk delivery/stt-cloud-debug.apk
          cp server/cloud-sync/README.md delivery/README.md
          git archive --format=zip -o delivery/stt-cloud-server.zip HEAD server/cloud-sync
          git rev-parse HEAD > delivery/COMMIT.txt
          cd delivery
          sha256sum stt-cloud-debug.apk stt-cloud-server.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stt-cloud-${{ github.sha }}
          path: delivery/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stt-cloud-lint
          path: |
            tools/cloud-app/app/build/reports/lint-results-debug.*
            cloud_sync/build/reports/lint-results-debug.*
  android-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: bash ./gradlew -p tools/cloud-app :app:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-android-storage-tests
          path: tools/cloud-app/app/build/reports/androidTests/
  stt-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'platforms;android-34' 'build-tools;34.0.0' 'build-tools;35.0.0'
      - name: Build cloud entry in original phone and Wear projects
        run: bash ./gradlew :app:assembleBaseDebug :wear:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: stt-integrated-cloud-${{ github.sha }}
          path: |
            app/build/outputs/apk/base/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
